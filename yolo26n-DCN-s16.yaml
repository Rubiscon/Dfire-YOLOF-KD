# YOLO26 with a DCN-enhanced YOLOF head whose single detection level sits at stride 16.
#
# Head: 11 = projection, 12/13/14 = dilated blocks, 15 = Detect. The level reads C4 instead
# of C5, giving a 40x40 lattice at imgsz 640. Dilations are doubled to (4, 12, 16) so the
# receptive field still covers the whole image (~1040 px).
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  # Read layer 6 (C3k2 at stride 16, 128 ch at width 0.25) instead of layer 10 (C5).
  - [6, 1, Conv, [512, 1, 1]]

  # Dilation doubled to preserve absolute receptive field at the finer stride.
  - [-1, 1, DilatedDeformBlock, [512, 4]]
  - [-1, 1, DilatedDeformBlock, [512, 12]]
  - [-1, 1, DilatedDeformBlock, [512, 16]]

  - [[14], 1, Detect, [nc]]
