# Ultralytics YOLO26 object detection model with a DCN-enhanced YOLOF head,
# SINGLE detection level moved from C5 (stride 32) to C4 (stride 16).
#
# Why: YOLOF's premise is that one level suffices, and it puts that level at stride 32. On
# small-object data the resulting 20x20 detection lattice is the binding constraint (measured:
# AP_S 0.10 while a second lattice lifted it 40%). Moving the SINGLE level to stride 16 keeps
# the model strictly single-scale and single-consumption -- it is still "only look feature
# once" -- but doubles the sampling density to a 40x40 lattice.
#
# Dilation is retuned. The receptive field of the three dilated blocks is 1 + 2*(d1+d2+d3)
# feature cells. The shipped d=(2,6,8) gives 33 cells, which at stride 32 covers 1056 px and
# therefore the whole 640 image. At stride 16 the same dilations would cover only ~528 px, so
# they are doubled here to (4,12,16) -> 65 cells -> ~1040 px, restoring full-image coverage.
#
# Layer indices in the head: 11 = projection, 12/13/14 = dilated blocks, 15 = Detect.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  # Read layer 6 (C3k2 at stride 16, 128 ch at width 0.25) instead of layer 10 (C5).
  - [6, 1, Conv, [512, 1, 1]]

  # Dilation doubled to preserve absolute receptive field at the finer stride.
  - [-1, 1, DilatedDeformBlock, [512, 4]]
  - [-1, 1, DilatedDeformBlock, [512, 12]]
  - [-1, 1, DilatedDeformBlock, [512, 16]]

  - [[14], 1, Detect, [nc]]
