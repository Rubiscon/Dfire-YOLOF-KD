# YOLO26 with a DCN-enhanced YOLOF head, a stride-16 tap and per-level head widths.
#
# Head: 11 = projection, 12/13/14 = dilated blocks (d = 2/6/8), 15 = tap, 16 = Detect.
# `head_width: per_level` keeps the tap at 48 channels and C5 at 128, so only the added
# lattice separates this model from yolo26n-DCN.yaml. There is no C5 bottleneck.
#
# Requires the `head_width` key to be forwarded by parse_model in ultralytics/nn/tasks.py.
nc: 2 # number of classes
end2end: True
reg_max: 1
head_width: per_level
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, Conv, [512, 1, 1]]

  - [-1, 1, DilatedDeformBlock, [512, 2]]
  - [-1, 1, DilatedDeformBlock, [512, 6]]
  - [-1, 1, DilatedDeformBlock, [512, 8]]

  # Stride-16 tap: backbone layer 5 (128 ch, stride 16) -> 256-channel bottleneck -> 48 ch out.
  - [5, 1, HighResTap, [192, 256, 3]]

  # Two-level Detect: [stride 16 (48 ch, narrow head), stride 32 (128 ch, full head)].
  - [[15, 14], 1, Detect, [nc]]
