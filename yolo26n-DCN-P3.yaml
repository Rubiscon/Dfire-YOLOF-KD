# Ultralytics YOLO26 object detection model with a DCN-enhanced YOLOF head
# plus a narrow stride-8 high-resolution tap.
#
# Why the tap exists: the dilated encoder below widens the receptive field on C5 but never
# adds sampling points. At imgsz 640 the detection lattice is 20x20, so objects below about
# one cell are not resolvable no matter how strong the encoder is - dilation is not
# resolution. That is the AP_S floor of this architecture.
#
# HighResTap restores one finer lattice from the backbone's stride-8 feature (layer 4) at
# 48 channels, rather than an FPN P3 at full width. It pays the same O((H/8)^2) exponent as
# a P3 pathway with a much smaller constant, and the Detect head gains a second level.
#
# Layer indices in the head: 11 = projection, 12/13/14 = dilated blocks (d = 2/6/8),
# 15 = high-resolution tap, 16 = Detect. The student backbone tap used by dictionary
# distillation (dict_student_layer = 10, the C2PSA output) is unchanged.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, Conv, [512, 1, 1]]

  # Replace the dilated residual blocks with DilatedDeformBlock that combines
  # dilation priors with a Deformable Conv refinement.
  - [-1, 1, DilatedDeformBlock, [512, 2]]
  - [-1, 1, DilatedDeformBlock, [512, 6]]
  - [-1, 1, DilatedDeformBlock, [512, 8]]

  # Narrow high-resolution tap: stride-8 backbone feature (layer 4) -> 128-channel lattice
  # through a 64-channel depthwise bottleneck. The output width equals the existing C5
  # level's, so the Detect head keeps the width it has in yolo26n-DCN.yaml. This model is
  # therefore the single-variable test of "add a stride-8 level": baseline vs this one.
  - [4, 1, HighResTap, [512, 256, 3]]

  # Two-level Detect: [stride 8, stride 32], ascending stride as in the FPN models.
  - [[15, 14], 1, Detect, [nc]]
