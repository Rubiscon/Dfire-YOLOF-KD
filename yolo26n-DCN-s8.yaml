# Ultralytics YOLO26 object detection model with a DCN-enhanced YOLOF head,
# SINGLE detection level moved from C5 (stride 32) to C3 (stride 8).
#
# The more aggressive variant of yolo26n-DCN-s16.yaml: an 80x80 detection lattice, still a
# single level and still one consumption of the backbone. Dilation is scaled by 4x to keep
# the absolute receptive field: 1 + 2*(d1+d2+d3) cells; (8,24,32) -> 129 cells -> ~1032 px at
# stride 8, versus 33 cells -> ~264 px if the shipped (2,6,8) were kept.
#
# Expect a large accuracy/compute trade: the head now runs at 80x80 while the backbone still
# computes every layer including SPPF+C2PSA at stride 32 (Ultralytics runs the backbone
# sequentially, so reading an earlier layer does NOT skip the later ones).
#
# Layer indices in the head: 11 = projection, 12/13/14 = dilated blocks, 15 = Detect.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  # Read layer 4 (C3k2 at stride 8, 128 ch at width 0.25).
  - [4, 1, Conv, [512, 1, 1]]

  # Dilation x4 to preserve absolute receptive field at the 4x finer stride.
  - [-1, 1, DilatedDeformBlock, [512, 8]]
  - [-1, 1, DilatedDeformBlock, [512, 24]]
  - [-1, 1, DilatedDeformBlock, [512, 32]]

  - [[14], 1, Detect, [nc]]
