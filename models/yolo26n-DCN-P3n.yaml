# YOLO26 with a DCN-enhanced YOLOF head, a stride-8 tap and a C5 bottleneck.
#
# Head: 11 = projection, 12/13/14 = dilated blocks (d = 2/6/8), 15 = tap, 16 = C5
# bottleneck, 17 = Detect. Under the default head-width rule both levels come out at
# 48 channels, so this model differs from yolo26n-DCN-headn.yaml only by the added lattice.
# The tap reads backbone layer 4; `dict_student_layer = 10` is unaffected.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, Conv, [512, 1, 1]]

  # Replace the dilated residual blocks with DilatedDeformBlock that combines
  # dilation priors with a Deformable Conv refinement.
  - [-1, 1, DilatedDeformBlock, [512, 2]]
  - [-1, 1, DilatedDeformBlock, [512, 6]]
  - [-1, 1, DilatedDeformBlock, [512, 8]]

  # Stride-8 tap: backbone layer 4 (128 ch, stride 8) -> 64-channel bottleneck -> 48 ch out.
  - [4, 1, HighResTap, [192, 256, 3]]

  # Same bottleneck the control arm applies to its C5 path. Must read layer 14 (the last
  # dilated block), not the tap, or the C5 branch collapses onto the stride-8 lattice.
  - [14, 1, Conv, [192, 1, 1]]

  # Two-level Detect: [stride 8, stride 32], ascending stride as in the FPN models.
  - [[15, 16], 1, Detect, [nc]]
