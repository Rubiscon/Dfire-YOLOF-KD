# YOLO26 with a DCN-enhanced YOLOF head whose single detection level sits at stride 8.
#
# Head: 11 = projection, 12/13/14 = dilated blocks, 15 = Detect. The level reads C3, giving
# an 80x80 lattice at imgsz 640. Dilations are scaled 4x to (8, 24, 32) for full-image
# coverage; the backbone still runs every later layer.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  # Read layer 4 (C3k2 at stride 8, 128 ch at width 0.25).
  - [4, 1, Conv, [512, 1, 1]]

  # Dilation x4 to preserve absolute receptive field at the 4x finer stride.
  - [-1, 1, DilatedDeformBlock, [512, 8]]
  - [-1, 1, DilatedDeformBlock, [512, 24]]
  - [-1, 1, DilatedDeformBlock, [512, 32]]

  - [[14], 1, Detect, [nc]]
