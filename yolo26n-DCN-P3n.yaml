# Ultralytics YOLO26 object detection model with a DCN-enhanced YOLOF head
# plus a stride-8 high-resolution tap feeding a two-level Detect head.
#
# Why the tap exists: the dilated encoder widens the receptive field on C5 but never adds
# sampling points. At imgsz 640 the detection lattice is 20x20, so objects below about one
# cell are not resolvable however strong the encoder is - dilation is not resolution. That
# is the AP_S floor of this architecture, and no feature- or response-matching distillation
# objective can lift it, because the information was never sampled.
#
# Design. The tap reads the backbone's stride-8 feature (layer 4), compresses it to a
# 64-channel depthwise bottleneck, and expands to 48 channels: cheap, and it supplies the
# detection head with an 80x80 lattice alongside the existing 20x20 one.
#
# Controlled comparison. The C5 path also passes through a 128 -> 48 bottleneck (layer 16),
# so the Detect head has identical width in this model and in yolo26n-DCN-headn.yaml. The
# only difference between the two models is the added stride-8 lattice.
#
# Layer indices in the head: 11 = projection, 12/13/14 = dilated blocks (d = 2/6/8),
# 15 = stride-8 tap, 16 = C5 bottleneck, 17 = Detect. The student backbone tap used by
# dictionary distillation (dict_student_layer = 10, the C2PSA output) is unchanged.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, Conv, [512, 1, 1]]

  # Replace the dilated residual blocks with DilatedDeformBlock that combines
  # dilation priors with a Deformable Conv refinement.
  - [-1, 1, DilatedDeformBlock, [512, 2]]
  - [-1, 1, DilatedDeformBlock, [512, 6]]
  - [-1, 1, DilatedDeformBlock, [512, 8]]

  # Stride-8 tap: backbone layer 4 (128 ch, stride 8) -> 64-channel bottleneck -> 48 ch out.
  - [4, 1, HighResTap, [192, 256, 3]]

  # Same bottleneck the control arm applies to its C5 path. Must read layer 14 (the last
  # dilated block), not the tap, or the C5 branch collapses onto the stride-8 lattice.
  - [14, 1, Conv, [192, 1, 1]]

  # Two-level Detect: [stride 8, stride 32], ascending stride as in the FPN models.
  - [[15, 16], 1, Detect, [nc]]
