# YOLO26 with a DCN-enhanced YOLOF head and a C5 bottleneck, no extra lattice.
#
# Head: 11 = projection, 12/13/14 = dilated blocks (d = 2/6/8), 15 = C5 bottleneck,
# 16 = Detect. Control arm for yolo26n-DCN-P3n.yaml: the 128 -> 48 bottleneck reproduces the
# head width the stride-8 tap produces, so the two models differ only by the added lattice.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, Conv, [512, 1, 1]]

  - [-1, 1, DilatedDeformBlock, [512, 2]]
  - [-1, 1, DilatedDeformBlock, [512, 6]]
  - [-1, 1, DilatedDeformBlock, [512, 8]]

  # Same bottleneck the tap model applies to its C5 path.
  - [-1, 1, Conv, [192, 1, 1]]

  - [[15], 1, Detect, [nc]]
