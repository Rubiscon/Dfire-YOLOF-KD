# Ultralytics YOLO26 object detection model with a DCN-enhanced YOLOF head
# plus a narrow *stride-16* high-resolution tap.
#
# Why stride 16 rather than 8. The stride-8 tap (yolo26n-DCN-P3n.yaml) lifted AP_S by 40% but
# cost roughly 25% inference latency, because the added 80x80 lattice makes the detection head
# do 16x the spatial work of the existing 20x20 one. A stride-16 tap gives a 40x40 lattice,
# i.e. 4x the head work instead of 16x, for roughly half the added cost. The question is
# whether enough of the AP_S gain survives at a latency that can be defended.
#
# This file is a byte-for-byte structural mirror of yolo26n-DCN-P3n.yaml with one change: the
# tap reads backbone layer 5 (stride 16) instead of layer 4 (stride 8). Same tap width, same
# C5 bottleneck, same Detect width, default (legacy) head-width rule. So the pair
# "P3n vs P4n" isolates the stride of the added lattice and nothing else.
#
# Note on the numbers below: parse_model scales a base module's c2 by the model width
# (0.25 at scale n) and rounds to 8, so the literal 192 becomes 48 channels, and 256 stays 256
# because only c2 is scaled. Layer 5 already emits 128 channels at stride 16.
#
# Layer indices in the head: 11 = projection, 12/13/14 = dilated blocks (d = 2/6/8),
# 15 = stride-16 tap, 16 = C5 bottleneck, 17 = Detect.
nc: 2 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, Conv, [512, 1, 1]]

  # Replace the dilated residual blocks with DilatedDeformBlock that combines
  # dilation priors with a Deformable Conv refinement.
  - [-1, 1, DilatedDeformBlock, [512, 2]]
  - [-1, 1, DilatedDeformBlock, [512, 6]]
  - [-1, 1, DilatedDeformBlock, [512, 8]]

  # Stride-16 tap: backbone layer 5 (128 ch, stride 16) -> 256-channel bottleneck -> 48 ch out.
  - [5, 1, HighResTap, [192, 256, 3]]

  # Same bottleneck yolo26n-DCN-P3n.yaml applies to its C5 path. Must read layer 14 (the last
  # dilated block), not the tap, or the C5 branch collapses onto the new lattice.
  - [14, 1, Conv, [192, 1, 1]]

  # Two-level Detect: [stride 16, stride 32], ascending stride as in the FPN models.
  - [[15, 16], 1, Detect, [nc]]
