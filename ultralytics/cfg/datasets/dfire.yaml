# D-Fire dataset (official train / val / test splits)
# Dataset structure:
# datasets/D-Fire/data/
#   ├── train/
#   │   ├── images/
#   │   └── labels/
#   ├── val/
#   │   ├── images/
#   │   └── labels/
#   └── tests/          # some dumps use this name instead of test/
#       ├── images/
#       └── labels/
#
# Legacy merged split (train+val combined, tests as val): datasets/D-Fire_old/

path:  ./datasets/D-Fire/data
train: train/images
val: val/images
test: tests/images

names:
  0: smoke
  1: fire
