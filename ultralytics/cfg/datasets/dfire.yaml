# D-Fire dataset descriptor.
#
# Ultralytics resolves a relative `path` against its `datasets_dir` setting, so either put an
# absolute root here or set `datasets_dir` to the directory that holds `D-Fire/`.
#
# Dataset structure:
# datasets/D-Fire/data/
#   ├── train/
#   │   ├── images/
#   │   └── labels/
#   ├── val/
#   │   ├── images/
#   │   └── labels/
#   └── tests/          # the Kaggle release names this folder `test/`
#       ├── images/
#       └── labels/
#
# Legacy merged split (train+val combined, tests as val): datasets/D-Fire_old/

path: ./datasets/D-Fire/data
train: train/images
val: val/images
test: tests/images

names:
  0: smoke
  1: fire
